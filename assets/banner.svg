<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#07152b"/>
      <stop offset="100%" stop-color="#030814"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#00f2fe" fill-opacity="0.2"/>
    </pattern>

    <style>
      .radar-sweep {
        transform-origin: 1040px 180px;
        animation: rotateSweep 8s linear infinite;
      }
      .orbit-path {
        animation: rotateOrbit 20s linear infinite;
        transform-origin: 1040px 180px;
      }
      .pulse-point {
        animation: pulseEffect 2.5s ease-in-out infinite alternate;
      }
      .sat-blink {
        animation: satFlash 1.8s infinite ease-in-out;
      }
      .stream-wave {
        stroke-dasharray: 8 6;
        animation: dashWave 25s linear infinite;
      }

      @keyframes rotateSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateOrbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulseEffect {
        0% { r: 3px; opacity: 0.4; }
        100% { r: 7px; opacity: 1; filter: drop-shadow(0 0 6px #00f2fe); }
      }
      @keyframes satFlash {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #ff0080); }
      }
      @keyframes dashWave {
        to { stroke-dashoffset: 1000; }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="360" rx="16" fill="url(#cyberGrid)"/>

  <!-- Dynamic / Animated Background Radar Elements (Positioned safely on the right) -->
  <g opacity="0.85">
    <!-- Concentric Target Rings -->
    <circle cx="1040" cy="180" r="140" fill="none" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="1040" cy="180" r="105" fill="none" stroke="#254d77" stroke-width="1.5"/>
    <circle cx="1040" cy="180" r="70" fill="none" stroke="#2c6299" stroke-width="1.5" stroke-dasharray="8 4"/>
    <circle cx="1040" cy="180" r="35" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Crosshairs -->
    <line x1="880" y1="180" x2="1200" y2="180" stroke="#1e3a5f" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="1040" y1="20" x2="1040" y2="340" stroke="#1e3a5f" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Radar Rotating Sweep -->
    <g class="radar-sweep">
      <path d="M 1040 180 L 1040 40 A 140 140 0 0 1 1160 250 Z" fill="url(#accentCyan)" opacity="0.12"/>
      <line x1="1040" y1="180" x2="1040" y2="40" stroke="#00f2fe" stroke-width="2" filter="url(#glow)"/>
    </g>

    <!-- Satellite Orbit -->
    <ellipse cx="1040" cy="180" rx="130" ry="50" fill="none" stroke="#7928ca" stroke-width="1.5" stroke-opacity="0.5" transform="rotate(-25 1040 180)" class="stream-wave"/>

    <!-- Orbiting Satellite Indicator -->
    <g class="orbit-path">
      <circle cx="1040" cy="40" r="5" fill="#ff0080" class="sat-blink"/>
      <circle cx="1040" cy="40" r="9" fill="none" stroke="#ff0080" stroke-width="1.5" opacity="0.6"/>
    </g>

    <!-- Pulsing Telemetry Nodes -->
    <circle cx="980" cy="130" r="4" fill="#00f2fe" class="pulse-point"/>
    <circle cx="1090" cy="220" r="5" fill="#4facfe" class="pulse-point"/>
    <circle cx="1010" cy="250" r="4" fill="#00f2fe" class="pulse-point"/>
  </g>

  <!-- Left Side Constellation / Geoint Geometric Mesh -->
  <g opacity="0.35">
    <path d="M 50 80 L 140 50 L 220 110 L 120 160 Z" fill="none" stroke="#00f2fe" stroke-width="1" class="stream-wave"/>
    <circle cx="50" cy="80" r="3" fill="#00f2fe"/>
    <circle cx="140" cy="50" r="3" fill="#00f2fe"/>
    <circle cx="220" cy="110" r="3" fill="#00f2fe"/>
    <circle cx="120" cy="160" r="3" fill="#00f2fe"/>

    <path d="M 40 280 L 110 320 L 190 270 L 100 240 Z" fill="none" stroke="#7928ca" stroke-width="1" class="stream-wave"/>
    <circle cx="40" cy="280" r="3" fill="#ff0080"/>
    <circle cx="110" cy="320" r="3" fill="#ff0080"/>
    <circle cx="190" cy="270" r="3" fill="#7928ca"/>
    <circle cx="100" cy="240" r="3" fill="#7928ca"/>
  </g>

  <!-- Foreground Divider Accent Line -->
  <line x1="80" y1="230" x2="800" y2="230" stroke="url(#glowLine)" stroke-width="2"/>

  <!-- Foreground Primary Typography (Unobstructed & Crisp) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Top Meta Tag / Pill -->
    <g transform="translate(80, 52)">
      <rect width="210" height="28" rx="14" fill="#0f2b48" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="16" cy="14" r="4" fill="#00f2fe" class="pulse-point"/>
      <text x="30" y="19" fill="#00f2fe" font-size="12" font-weight="700" letter-spacing="1.5">GEOINT &amp; OSINT RADAR</text>
    </g>

    <!-- Main Title -->
    <text x="80" y="132" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome OSINT &amp; <tspan fill="url(#accentCyan)">GEOINT</tspan>
    </text>

    <!-- Subtitle -->
    <text x="80" y="172" fill="#94a3b8" font-size="19" font-weight="400">
      Geospatial Intelligence, Satellite Reconnaissance &amp; Multi-Source Geolocation
    </text>

    <text x="80" y="206" fill="#64748b" font-size="14" font-weight="500">
      Curated Commercial Platforms &amp; Open-Source Self-Hosted Intelligence Toolkits
    </text>

    <!-- Feature Feature Badges in Foreground -->
    <g transform="translate(80, 255)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="34" rx="8" fill="#111c33" stroke="#254d77" stroke-width="1"/>
        <text x="65" y="21" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">🛰️ Satellite EO</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(142, 0)">
        <rect width="140" height="34" rx="8" fill="#111c33" stroke="#254d77" stroke-width="1"/>
        <text x="70" y="21" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">📍 Geolocation</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(294, 0)">
        <rect width="135" height="34" rx="8" fill="#111c33" stroke="#254d77" stroke-width="1"/>
        <text x="67" y="21" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">🚢 Maritime AIS</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(441, 0)">
        <rect width="145" height="34" rx="8" fill="#111c33" stroke="#254d77" stroke-width="1"/>
        <text x="72" y="21" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">🌐 3D GPU Globes</text>
      </g>
      <!-- Badge 5 -->
      <g transform="translate(598, 0)">
        <rect width="140" height="34" rx="8" fill="#111c33" stroke="#254d77" stroke-width="1"/>
        <text x="70" y="21" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle">🛡️ OSINT Fusion</text>
      </g>
    </g>
  </g>
</svg>
